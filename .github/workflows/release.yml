name: Release & Package Plugin

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["7.4", "8.0", "8.1", "8.2", "8.3"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Syntax Linting
        run: |
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;

  package:
    name: Package WooCommerce Plugin
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Plugin ZIP
        run: |
          mkdir -p build/kkhay languages
          cp -r assets includes languages kkhay.php readme.txt README.md LICENSE build/kkhay/
          find build/kkhay -name ".*" -delete
          cd build
          zip -r ../kkhay.zip kkhay/
          cd ..
          ls -lh kkhay.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kkhay-zip
          path: kkhay.zip

      - name: Create or Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: kkhay.zip
          generate_release_notes: true

  deploy-wporg:
    name: Deploy to WordPress.org SVN
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to WordPress.org
        if: env.SVN_PASSWORD != ''
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME || 'boboaungdev' }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: kkhay

